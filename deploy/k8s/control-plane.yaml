# Control plane: one pod running the API with its in-process worker and reconciler.
#
# Why replicas: 1 and strategy: Recreate — the database is SQLite on a ReadWriteOnce volume.
# Two pods would mean two writers on one file across a volume boundary, which SQLite does
# not support. Recreate guarantees the old pod is gone before the new one mounts the volume.
# Scaling out requires PostgreSQL first (see docs/design-decisions.md).
#
# Pod restart / reschedule behaviour: the PVC keeps the database, so instances, reservations
# and queued operations survive. An operation that was mid-flight stays RUNNING under its
# lease; the startup reconcile re-queues it once the lease expires, and provider calls are
# idempotent, so the retry is safe. Requests arriving during the restart fail fast (no pod
# behind the Service) and clients retry with their Idempotency-Key.
apiVersion: v1
kind: Namespace
metadata:
  name: vmlm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmlm-config
  namespace: vmlm
data:
  VMLM_DATABASE_URL: sqlite:////data/vmlm.db
  VMLM_LOG_LEVEL: INFO
  VMLM_RECONCILE_INTERVAL_S: "15"
  VMLM_HEARTBEAT_STALE_S: "45"
  VMLM_FAILURE_INJECTION_ENABLED: "false"
  # Each Kubernetes node that runs the agent DaemonSet must appear here as agent_managed;
  # "kind-control-plane" is the node name of a default single-node kind cluster.
  VMLM_HOSTS: >-
    [{"name":"static-host","vcpus":8,"memory_mib":16384},
     {"name":"kind-control-plane","vcpus":1,"memory_mib":512,"agent_managed":true}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmlm-data
  namespace: vmlm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmlm-api
  namespace: vmlm
  labels: { app.kubernetes.io/name: vmlm-api }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: vmlm-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vmlm-api }
    spec:
      terminationGracePeriodSeconds: 20   # > uvicorn's 10 s graceful shutdown
      automountServiceAccountToken: false # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                    # makes the PVC writable for the app user
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: vm-lifecycle-manager:local
          imagePullPolicy: IfNotPresent   # loaded with `kind load docker-image`
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: vmlm-config }
          env:
            # Created out of band (never committed):
            #   kubectl -n vmlm create secret generic vmlm-secrets \
            #     --from-literal=api-key=... --from-literal=admin-api-key=...
            - name: VMLM_API_KEY
              valueFrom: { secretKeyRef: { name: vmlm-secrets, key: api-key } }
            - name: VMLM_ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: vmlm-secrets, key: admin-api-key } }
          # liveness = process can serve and reach its DB; readiness also needs the worker.
          # A failing readiness probe removes the pod from the Service without restarting
          # it; only a failing liveness probe restarts the container.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: vmlm-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: vmlm-api
  namespace: vmlm
spec:
  selector: { app.kubernetes.io/name: vmlm-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
