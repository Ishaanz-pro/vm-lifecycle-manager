[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vm-lifecycle-manager"
version = "0.2.0"
description = "Mini VM control plane: durable operations, scheduling, reconciliation (simulated provider by default)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vmlm-worker = "vmlm.worker_main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Starlette's TestClient notice about httpx; unrelated to this project's code.
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
