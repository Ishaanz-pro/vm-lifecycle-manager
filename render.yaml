# Render Blueprint for a public demo of the control plane (simulated provider, no real VMs).
# The dashboard is at /ui/ (the root URL redirects there); the REST docs are at /docs.
# Create it from the dashboard: New > Blueprint > pick this repository.
#
# Free-tier notes: the service sleeps when idle (first request after a pause is slow) and its
# disk is ephemeral, so the SQLite database resets on restart. That is fine for a demo; the
# app re-seeds its hosts on startup. For anything durable, attach a persistent disk or use
# PostgreSQL (not yet tested, see README "Verification status").
services:
  - type: web
    name: vm-lifecycle-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      # The image listens on 8000; tell Render which port to route to.
      - key: PORT
        value: "8000"
      # Generated by Render and shown only in the dashboard. Never committed.
      - key: VMLM_API_KEY
        generateValue: true
      - key: VMLM_ADMIN_API_KEY
        generateValue: true
      - key: VMLM_FAILURE_INJECTION_ENABLED
        value: "false"
      # Demo mode: the dashboard at /ui receives the *user-tier* key from /ui/config, so
      # visitors can click around without being given a key. The admin key is never exposed.
      - key: VMLM_DEMO_MODE
        value: "true"
      # Slow the simulated provider slightly so PROVISIONING / STOPPING are visible.
      - key: VMLM_SIMULATED_LATENCY_S
        value: "1.2"
      # Three small hosts so capacity, best-fit placement and rejections are easy to see.
      - key: VMLM_HOSTS
        value: '[{"name":"host-a","vcpus":8,"memory_mib":16384},{"name":"host-b","vcpus":8,"memory_mib":16384},{"name":"host-c","vcpus":4,"memory_mib":8192}]'
      - key: VMLM_LOG_LEVEL
        value: INFO
